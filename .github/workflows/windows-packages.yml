name: Windows WinUI 3 packages

on:
  workflow_dispatch:
  push:
    branches: [main, WinUI3]
    paths:
      - 'src/**'
      - 'tests/SimplerFileBot.Core.Tests/**'
      - 'scripts/build-windows.ps1'
      - 'packaging/windows/**'
      - '.github/workflows/windows-packages.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/SimplerFileBot.Core.Tests/**'
      - 'scripts/build-windows.ps1'
      - 'packaging/windows/**'
      - '.github/workflows/windows-packages.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe") -and
              -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Test and build portable ZIP and installer
        shell: pwsh
        run: |
          try {
            ./scripts/build-windows.ps1 -Target All *>&1 | Tee-Object -FilePath build-output.log
            if ($LASTEXITCODE -ne 0) { throw 'Build script failed.' }
          } catch {
            if (Test-Path build-output.log) {
              $Tail = (Get-Content build-output.log -Tail 35) -join "`n"
              $Message = $Tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Windows build output::$Message"
            }
            throw
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Simpler-FileBot-WinUI3-x64
          path: dist/windows/packages/*
          if-no-files-found: error
