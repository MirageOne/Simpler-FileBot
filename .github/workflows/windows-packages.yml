name: Windows WinUI 3 packages

on:
  workflow_dispatch:
  push:
    branches: [main, WinUI3]
    paths:
      - 'src/**'
      - 'global.json'
      - 'tests/SimplerFileBot.Core.Tests/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/smoke-test-windows.ps1'
      - 'packaging/windows/**'
      - '.github/workflows/windows-packages.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'global.json'
      - 'tests/SimplerFileBot.Core.Tests/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/smoke-test-windows.ps1'
      - 'packaging/windows/**'
      - '.github/workflows/windows-packages.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe") -and
              -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Test and build portable ZIP and installer
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Target All *>&1 | Tee-Object -FilePath build-output.log
      - name: Smoke-test extracted portable app
        shell: pwsh
        run: |
          $Stage = Get-ChildItem ./build/windows/portable -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $Stage) { throw 'Portable staging directory was not produced.' }
          $Failed = @()
          foreach ($Mode in @('empty', 'text', 'button', 'combo', 'list', 'info', 'navigation_empty', 'navigation', 'layout', 'no_mica', 'full')) {
            if ($Mode -eq 'full') { Remove-Item Env:SIMPLER_FILEBOT_DIAGNOSTIC_UI -ErrorAction SilentlyContinue }
            else { $env:SIMPLER_FILEBOT_DIAGNOSTIC_UI = $Mode }
            "Diagnostic UI mode: $Mode" | Tee-Object -FilePath smoke-output.log -Append
            $WaitSeconds = if ($Mode -eq 'full') { 15 } else { 4 }
            try { ./scripts/smoke-test-windows.ps1 -Directory $Stage.FullName -WaitSeconds $WaitSeconds *>&1 | Tee-Object -FilePath smoke-output.log -Append }
            catch { $Failed += $Mode; $_ | Tee-Object -FilePath smoke-output.log -Append }
          }
          "Failed UI modes: $($Failed -join ', ')" | Tee-Object -FilePath smoke-output.log -Append
          if ($Failed.Count) { throw "Portable startup failed in UI modes: $($Failed -join ', ')" }
      - name: Report build failure
        if: failure()
        shell: pwsh
        run: |
          $Tail = if (Test-Path smoke-output.log) { Get-Content smoke-output.log -Tail 45 } elseif (Test-Path build-output.log) { Get-Content build-output.log -Tail 45 } else { @('No build log was created.') }
          @('### Windows build output', '```text') + $Tail + @('```') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $Message = ($Tail -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Host "::error title=Windows build output::$Message"
      - uses: actions/upload-artifact@v4
        with:
          name: Simpler-FileBot-WinUI3-x64
          path: dist/windows/packages/*
          if-no-files-found: error
